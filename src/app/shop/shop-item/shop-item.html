<div class="product-item">
  <div class="product-images">

    <!-- Main Image -->
    @if (item.photos && item.photos.length > 0) {
    <div class="main-image-container">
      <img [src]="'https://localhost:44367/' + item.photos[0].imageName" [alt]="item.name" class="main-image">
    </div>

    <!-- Thumbnails -->
    <div class="thumbnail">

      @for (photo of item.photos; track $index) {
      <button class="thumbnail-btn">
        <img [src]="'https://localhost:44367/' + photo.imageName" [alt]="item.name" class="small-image">
      </button>
      }

    </div>
    }

  </div>

  <div class="card-body">

    <h5 class="card-title">
      {{ item.name }}
    </h5>

    <p class="card-text">
      {{ item.description }}
    </p>

    <p class="price">

      <span class="old-price">
        ${{ item.price }}
      </span>

      <span class="new-price">
        ${{ item.oldPrice }}
      </span>

    </p>

    <div class="rating mb-3">
      ★★★★★
    </div>

    <button class="btn btn-outline-primary favorite-icon">
      <i class="fa fa-bookmark"></i>
    </button>

    <div class="d-flex justify-content-between align-items-start">

      <button class="btn btn-dark">
        <i class="fa fa-shopping-cart"></i>
        Add to Cart
      </button>

      <button class="btn btn-success">
        <i class="fa fa-info-circle"></i>
        Details
      </button>

    </div>

  </div>

</div>
